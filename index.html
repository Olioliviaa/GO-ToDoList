<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📋 To Do List｜待办事项</title>
    <style>
        /* 🎨 全局视觉：延续明亮扁平、现代渐变感 */
        :root {
            --primary-color: #3AA1FF; /* GO系列标志性霓虹蓝 */
            --accent-color: #FFDE00;  /* 高亮黄 */
            --bg-gradient: linear-gradient(135deg, #F0F4F8 0%, #E2E8F0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #2D3748;
            --text-muted: #A0AEC0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-gradient); 
            color: var(--text-main); 
            max-width: 680px; 
            margin: 0 auto; 
            padding: 30px 16px; 
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* 🏷️ 顶部区域 */
        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 { 
            font-size: 26px; 
            font-weight: 800; 
            color: #1A202C; 
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* 📊 进度控制条 */
        .progress-container {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .progress-bar { 
            width: 100%; 
            background: #E2E8F0; 
            height: 12px; 
            border-radius: 99px; 
            overflow: hidden; 
        }

        .progress { 
            height: 100%; 
            background: linear-gradient(90deg, var(--primary-color) 0%, #63B3ED 100%); 
            width: 0%; 
            border-radius: 99px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        /* 📋 清单容器 */
        .task-list { 
            list-style: none; 
            padding: 0; 
            margin: 0;
        }

        /* 🃏 卡片设计 */
        .task-item { 
            background: var(--card-bg); 
            padding: 18px 20px; 
            margin-bottom: 12px; 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(148, 163, 184, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .task-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(148, 163, 184, 0.15);
        }

        /* 已完成视觉置灰 */
        .task-item.done { 
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(226, 232, 240, 0.5);
            box-shadow: none;
        }
        
        .task-item.done .task-text { 
            text-decoration: line-through; 
            color: var(--text-muted); 
        }

        .task-id {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 32px;
        }

        .task-text {
            font-size: 15px;
            font-weight: 500;
            flex-grow: 1;
            line-height: 1.4;
            transition: color 0.2s ease;
        }

        /* 🔘 自定义复选框 */
        .checkbox-wrapper {
            position: relative;
            width: 24px;
            height: 24px;
            margin-right: 16px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .custom-checkbox {
            position: absolute;
            top: 0;
            left: 0;
            height: 24px;
            width: 24px;
            background-color: #FFF;
            border: 2px solid #CBD5E1;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .checkbox-wrapper:hover .custom-checkbox {
            border-color: var(--primary-color);
        }

        .checkbox-wrapper input:checked ~ .custom-checkbox {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .custom-checkbox::after {
            content: "";
            position: absolute;
            display: none;
            left: 7px;
            top: 3px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg);
        }

        .checkbox-wrapper input:checked ~ .custom-checkbox::after {
            display: block;
        }

        /* ⏳ 状态加载器 */
        .loading { 
            text-align: center; 
            font-size: 15px; 
            font-weight: 600;
            color: var(--text-muted); 
            padding: 60px 0; 
        }
    </style>
</head>
<body>

    <header>
        <div class="subtitle">GO - TO DO LIST</div>
        <h1>📋 To Do List｜待办事项</h1>
    </header>

    <div class="progress-container">
        <div class="progress-header">
            <span>完成进度</span>
            <!-- 🛠️ 进度文本初始为 0 / 0，后续由实际表格数据重写 -->
            <span id="progressText">0 / 0</span>
        </div>
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
    </div>
    
    <div id="loading" class="loading">正在同步 GO-Database...</div>
    <ul id="taskList" class="task-list"></ul>

    <script>
        // 连接到你的 Google Apps Script 网址
        const API_URL = 'https://script.google.com/macros/s/AKfycbxZyMjY5TCZc0QTUMm99JgwWbbodZT-c_u51mfjFbpsnkTxLAhWaYwBjI7Y8oVwZIkDtg/exec'; 

        let tasksData = [];

        // 从 Google Sheet 初始化提取数据
        async function fetchTasks() {
            try {
                // 🛠️ 核心修复：增加对 Google 特有的重定向跳转支持，彻底解决手机端跨域拦截导致的假数据问题
                const response = await fetch(API_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });
                tasksData = await response.json();
                document.getElementById('loading').style.display = 'none';
                renderTasks();
            } catch (error) {
                document.getElementById('loading').innerText = '数据读取异常，请确认表格名字已改为 Tasks。';
                console.error(error);
            }
        }

        // 渲染页面元素
        function renderTasks() {
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';
            let completedCount = 0;

            tasksData.forEach(item => {
                if (item.completed) completedCount++;

                const li = document.createElement('li');
                li.className = `task-item ${item.completed ? 'done' : ''}`;
                
                // 🛠️ 优化点击逻辑：防止点击卡片和点击方框相互冲突导致计数出错
                li.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        toggleTask(item.id, !item.completed);
                    }
                };
                
                li.innerHTML = `
                    <div class="checkbox-wrapper">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleTask(${item.id}, this.checked)">
                        <span class="custom-checkbox"></span>
                    </div>
                    <span class="task-id">${item.id}.</span>
                    <span class="task-text">${item.task}</span>
                `;
                listEl.appendChild(li);
            });

            // 🛠️ 彻底告别 999：总数 total 100% 由表格回传的任务数组长度决定，写多少项就是多少项
            const total = tasksData.length;
            document.getElementById('progressText').innerText = `${completedCount} / ${total}`;
            const progressPercent = total > 0 ? (completedCount / total) * 100 : 0;
            document.getElementById('progress').style.width = `${progressPercent}%`;
        }

        // 处理打卡更新并回传 Google 表格
        async function toggleTask(id, isChecked) {
            const task = tasksData.find(t => t.id === id);
            if (task) {
                task.completed = isChecked;
                renderTasks(); // 手机端即时打勾并重算进度，体验极为丝滑
            }

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, completed: isChecked })
                });
            } catch (error) {
                console.error('云端同步失败:', error);
            }
        }

        // 启动拉取数据
        fetchTasks();
    </script>
</body>
</html>
