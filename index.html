<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Notion Todo</title>
    <!-- Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .todo-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-800 antialiased flex flex-col items-center p-4 pb-12">

    <!-- 顶部状态栏感 -->
    <div class="w-full max-w-md flex justify-between items-center mt-6 mb-4 px-2">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                <i data-lucide="check-square" class="text-indigo-600"></i> 今日任务
            </h1>
            <p class="text-xs text-slate-600 mt-1" id="date-string">加载中...</p>
        </div>
        <button onclick="fetchTodos()" class="p-2 bg-white/60 active:scale-95 rounded-full shadow-xs border border-white/40 transition-all">
            <i data-lucide="refresh-cw" class="w-5 h-5 text-slate-700" id="refresh-icon"></i>
        </button>
    </div>

    <!-- 主卡片容器 -->
    <div class="w-full max-w-md glass-card rounded-3xl p-5 shadow-xl flex-1 flex flex-col min-h-[400px]">
        
        <!-- 骨架屏加载动画 -->
        <div id="loading" class="space-y-4 py-4">
            <div class="h-14 bg-slate-200/50 rounded-2xl animate-pulse"></div>
            <div class="h-14 bg-slate-200/50 rounded-2xl animate-pulse"></div>
            <div class="h-14 bg-slate-200/50 rounded-2xl animate-pulse"></div>
        </div>

        <!-- 空白页提示 -->
        <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-center opacity-60 py-12">
            <i data-lucide="sparkles" class="w-12 h-12 text-indigo-500 mb-3 animate-bounce"></i>
            <p class="text-sm font-medium">太棒了！目前没有待办事项</p>
        </div>

        <!-- 待办列表 -->
        <ul id="todo-list" class="space-y-3 overflow-y-auto max-h-[60vh] pr-1">
            <!-- 动态渲染 -->
        </ul>
    </div>

    <script>
        // ⚠️ 请在这里替换为您部署好的 Google Apps Script 网址
        const API_URL = "https://script.google.com/macros/s/AKfycby1lIDA9NhS_VKhtBXEHmiquDxeT_XQ1eoMy5DMvKwq4b_NqVwUYuT8-IV4MmVvEtlw/exec"; 

        // 初始化日期
        document.getElementById('date-string').innerText = new Date().toLocaleDateString('zh-CN', { weekday: 'long', month: 'short', day: 'numeric' });

        // 获取任务数据
        async function fetchTodos() {
            showLoading(true);
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('animate-spin');
            
            try {
                const response = await fetch(API_URL);
                const todos = await response.json();
                renderTodos(todos);
            } catch (error) {
                alert('读取表格失败，请检查 API 配置');
                console.error(error);
            } finally {
                showLoading(false);
                icon.classList.remove('animate-spin');
            }
        }

        // 渲染页面
        function renderTodos(todos) {
            const listEl = document.getElementById('todo-list');
            listEl.innerHTML = '';
            
            if (todos.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            document.getElementById('empty-state').classList.add('hidden');

            todos.forEach(todo => {
                const isDone = todo.status === "DONE" || todo.status === true;
                const li = document.createElement('li');
                li.className = `todo-item flex items-center justify-between p-4 rounded-2xl border bg-white/80 ${isDone ? 'opacity-50 border-transparent shadow-none bg-white/40' : 'border-white/60 shadow-xs'}`;
                
                li.innerHTML = `
                    <div class="flex items-center gap-3.5 flex-1" onclick="toggleTodo(${todo.id}, ${!isDone})">
                        <div class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${isDone ? 'bg-indigo-600 border-indigo-600' : 'border-slate-300 bg-white'}" id="checkbox-${todo.id}">
                            ${isDone ? '<i data-lucide="check" class="w-4 h-4 text-white"></i>' : ''}
                        </div>
                        <span class="text-[15px] font-medium leading-tight ${isDone ? 'line-through text-slate-400' : 'text-slate-800'}">${todo.task}</span>
                    </div>
                `;
                listEl.appendChild(li);
            });
            lucide.createIcons();
        }

        // 勾选/反选同步
        async function toggleTodo(id, newStatus) {
            // 前端先高亮/变色，实现无延迟的瞬间反馈体验
            const checkbox = document.getElementById(`checkbox-${id}`);
            if (newStatus) {
                checkbox.className = "w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all bg-indigo-600 border-indigo-600";
                checkbox.innerHTML = '<i data-lucide="check" class="w-4 h-4 text-white"></i>';
            } else {
                checkbox.className = "w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all border-slate-300 bg-white";
                checkbox.innerHTML = '';
            }
            lucide.createIcons();

            // 发送网络请求同步到 Google Sheets
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // 解决跨域
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, status: newStatus ? "DONE" : "TODO" })
                });
                // 为确保数据绝对同步，一秒后自动刷新一次
                setTimeout(fetchTodos, 1200);
            } catch (error) {
                alert('同步失败，请重试');
            }
        }

        function showLoading(isLoading) {
            document.getElementById('loading').style.display = isLoading ? 'block' : 'none';
            if (isLoading) document.getElementById('empty-state').classList.add('hidden');
        }

        // 首次加载
        window.onload = () => { lucide.createIcons(); fetchTodos(); };
    </script>
</body>
</html>
